<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Виджеты TradingView — демо</title>
<style>
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --text: #1d1f1e;
    --muted: #5f6461;
    --line: #dcdad3;
    --accent: #2f6b5a;
    --accent-soft: #e3ece8;
  }
  [data-theme="dark"] {
    --bg: #141615;
    --surface: #1c1f1e;
    --text: #e9eae7;
    --muted: #9aa19d;
    --line: #2e3331;
    --accent: #6fb39c;
    --accent-soft: #23302c;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 130px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }
  h1, h2 { margin: 0; line-height: 1.2; }
  h1 { font-size: 34px; }
  h2 { font-size: 26px; }

  /* Шапка */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .top-inner { display: flex; align-items: center; gap: 16px; padding: 12px 32px; }
  .brand { font-weight: 700; white-space: nowrap; }
  .nav { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a {
    color: var(--muted); text-decoration: none; white-space: nowrap;
    padding: 6px 12px; border-radius: 999px; font-size: 14px;
    transition: background .15s, color .15s;
  }
  .nav a:hover { background: var(--accent-soft); color: var(--text); }

  /* Переключатели */
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    font: inherit; font-size: 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    padding: 6px 12px; border-radius: 8px;
    transition: background .15s, border-color .15s;
  }
  .seg button:hover { border-color: var(--accent); }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  [data-theme="dark"] .seg button[aria-pressed="true"] { color: #10201b; }

  .wrap { padding: 40px 32px 80px; display: grid; gap: 48px; }

  .block { display: grid; gap: 16px; }
  .block-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

  .widget {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  .widget .tradingview-widget-container,
  .widget .tradingview-widget-container__widget { height: 100%; width: 100%; }
  /* Бегущая строка в шапке */
  .tape { min-height: 46px; border-top: 1px solid var(--line); }
  .tape .tradingview-widget-container { width: 100%; }

  /* Два виджета в один ряд */
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: end; }

  .h-overview { height: 520px; }
  .h-pair { height: 400px; }
  .h-heat { height: 580px; }
  .h-cal { height: 580px; }
  .h-screener { height: 600px; }

  @media (max-width: 980px) {
    .pair { grid-template-columns: 1fr; gap: 40px; }
  }
  @media (max-width: 640px) {
    h1 { font-size: 27px; }
    h2 { font-size: 22px; }
    .top-inner { padding: 10px 16px; gap: 10px; }
    .brand { display: none; }
    .wrap { padding: 28px 16px 60px; gap: 40px; }
    .h-overview { height: 440px; }
    .h-pair { height: 360px; }
    .h-heat { height: 480px; }
    .h-cal { height: 520px; }
    .h-screener { height: 520px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">Виджеты TradingView</div>
    <nav class="nav">
      <a href="#overview">Symbol Overview</a>
      <a href="#market">Market Data</a>
      <a href="#ta">Technical Analysis</a>
      <a href="#heatmap">Heatmap</a>
      <a href="#calendar">Economic Calendar</a>
      <a href="#screener">Screener</a>
    </nav>
    <div class="seg" id="themeSeg">
      <button type="button" data-value="light" aria-pressed="true">Светлая</button>
      <button type="button" data-value="dark" aria-pressed="false">Тёмная</button>
    </div>
  </div>
  <!-- Бегущая строка котировок: сразу под меню, на всю ширину экрана -->
  <div class="tape" id="w-tape"></div>
</header>

<main class="wrap">

  <h1>Виджеты TradingView</h1>

  <section class="block" id="overview">
    <div class="block-head">
      <h2>Symbol Overview</h2>
      <div class="seg" id="chartSeg">
        <button type="button" data-value="line" aria-pressed="true">Линия</button>
        <button type="button" data-value="candlesticks" aria-pressed="false">Свечи</button>
      </div>
    </div>
    <div class="widget h-overview" id="w-overview"></div>
  </section>

  <div class="pair">
    <section class="block" id="market">
      <h2>Market Data</h2>
      <div class="widget h-pair" id="w-market"></div>
    </section>

    <section class="block" id="ta">
      <div class="block-head">
        <h2>Technical Analysis</h2>
        <div class="seg" id="taSeg"></div>
      </div>
      <div class="widget h-pair" id="w-ta"></div>
    </section>
  </div>

  <section class="block" id="heatmap">
    <h2>Heatmap</h2>
    <div class="widget h-heat" id="w-heat"></div>
  </section>

  <section class="block" id="calendar">
    <h2>Economic Calendar</h2>
    <div class="widget h-cal" id="w-cal"></div>
  </section>

  <section class="block" id="screener">
    <h2>Screener</h2>
    <div class="widget h-screener" id="w-screener"></div>
  </section>

</main>

<script>
  // Инструменты для примеров
  var SYMBOLS = [
    { tv: "FX:EURUSD",       name: "EUR/USD" },
    { tv: "OANDA:XAUUSD",    name: "Золото" },
    { tv: "BITSTAMP:BTCUSD", name: "Bitcoin" },
    { tv: "NASDAQ:AAPL",     name: "Apple" },
    { tv: "TVC:UKOIL",       name: "Нефть Brent" }
  ];

  var theme = "light";
  var chartType = "line";
  var taSymbol = SYMBOLS[0].tv;

  // Вставляет виджет в контейнер: старый удаляется, новый создаётся заново.
  // Ссылка «by TradingView» под виджетом не добавляется.
  function mount(id, file, config) {
    var box = document.getElementById("w-" + id);
    box.innerHTML = "";

    var container = document.createElement("div");
    container.className = "tradingview-widget-container";
    var inner = document.createElement("div");
    inner.className = "tradingview-widget-container__widget";
    container.appendChild(inner);

    var script = document.createElement("script");
    script.type = "text/javascript";
    script.async = true;
    script.src = "https://s3.tradingview.com/external-embedding/" + file;
    script.textContent = JSON.stringify(config);
    container.appendChild(script);

    box.appendChild(container);
  }

  function renderTape() {
    mount("tape", "embed-widget-ticker-tape.js", {
      symbols: SYMBOLS.map(function (s) { return { proName: s.tv, title: s.name }; }),
      showSymbolLogo: true,
      isTransparent: false,
      displayMode: "adaptive",
      colorTheme: theme,
      locale: "ru"
    });
  }

  function renderMarket() {
    mount("market", "embed-widget-market-quotes.js", {
      width: "100%",
      height: "100%",
      symbolsGroups: [{
        name: "Популярные",
        symbols: SYMBOLS.map(function (s) { return { name: s.tv, displayName: s.name }; })
      }],
      showSymbolLogo: true,
      isTransparent: false,
      colorTheme: theme,
      locale: "ru"
    });
  }

  function renderOverview() {
    mount("overview", "embed-widget-symbol-overview.js", {
      symbols: SYMBOLS.map(function (s) { return [s.name, s.tv + "|1M"]; }),
      chartOnly: false,
      width: "100%",
      height: "100%",
      locale: "ru",
      colorTheme: theme,
      autosize: true,
      showVolume: false,
      showMA: false,
      hideDateRanges: false,
      hideMarketStatus: false,
      hideSymbolLogo: false,
      scalePosition: "right",
      scaleMode: "Normal",
      fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif",
      fontSize: "10",
      noTimeScale: false,
      valuesTracking: "1",
      changeMode: "price-and-percent",
      chartType: chartType,
      lineWidth: 2,
      lineType: 0,
      upColor: "#22ab94",
      downColor: "#f7525f",
      borderUpColor: "#22ab94",
      borderDownColor: "#f7525f",
      wickUpColor: "#22ab94",
      wickDownColor: "#f7525f",
      // Период|размер одной свечи. Свечи крупнее, чтобы их было видно
      dateRanges: ["1d|15", "5d|60", "1m|240", "3m|1D", "12m|1W", "all|1M"]
    });
  }

  function renderHeat() {
    mount("heat", "embed-widget-stock-heatmap.js", {
      exchanges: [],
      dataSource: "SPX500",
      // Одна сплошная карта, без разбивки на отрасли
      grouping: "no_group",
      blockSize: "market_cap_basic",
      blockColor: "change",
      locale: "ru",
      symbolUrl: "",
      colorTheme: theme,
      hasTopBar: true,
      isDataSetEnabled: true,
      isZoomEnabled: true,
      hasSymbolTooltip: true,
      isMonoSize: false,
      width: "100%",
      height: "100%"
    });
  }

  function renderTA() {
    mount("ta", "embed-widget-technical-analysis.js", {
      interval: "1D",
      width: "100%",
      height: "100%",
      isTransparent: false,
      symbol: taSymbol,
      showIntervalTabs: true,
      displayMode: "single",
      locale: "ru",
      colorTheme: theme
    });
  }

  function renderCal() {
    mount("cal", "embed-widget-events.js", {
      colorTheme: theme,
      isTransparent: false,
      width: "100%",
      height: "100%",
      locale: "ru",
      importanceFilter: "0,1",
      countryFilter: "us,eu,gb,jp,cn"
    });
  }

  function renderScreener() {
    mount("screener", "embed-widget-screener.js", {
      width: "100%",
      height: "100%",
      defaultColumn: "overview",
      defaultScreen: "general",
      market: "forex",
      showToolbar: true,
      colorTheme: theme,
      locale: "ru",
      isTransparent: false
    });
  }

  function renderAll() {
    renderTape(); renderOverview(); renderMarket(); renderTA();
    renderHeat(); renderCal(); renderScreener();
  }

  // Отмечает нажатую кнопку в группе
  function press(seg, value) {
    seg.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-value") === value ? "true" : "false");
    });
  }

  // Линия / Свечи
  var chartSeg = document.getElementById("chartSeg");
  chartSeg.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn || btn.getAttribute("data-value") === chartType) return;
    chartType = btn.getAttribute("data-value");
    press(chartSeg, chartType);
    renderOverview();
  });

  // Кнопки инструментов для технического анализа
  var taSeg = document.getElementById("taSeg");
  SYMBOLS.forEach(function (s) {
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("data-value", s.tv);
    b.textContent = s.name;
    taSeg.appendChild(b);
  });
  press(taSeg, taSymbol);
  taSeg.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn || btn.getAttribute("data-value") === taSymbol) return;
    taSymbol = btn.getAttribute("data-value");
    press(taSeg, taSymbol);
    renderTA();
  });

  // Тема для страницы и всех виджетов сразу, запоминается между заходами
  var themeSeg = document.getElementById("themeSeg");

  function applyTheme(value) {
    theme = value;
    document.documentElement.setAttribute("data-theme", value);
    press(themeSeg, value);
  }

  themeSeg.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn || btn.getAttribute("data-value") === theme) return;
    applyTheme(btn.getAttribute("data-value"));
    try { localStorage.setItem("tv-demo-theme", theme); } catch (err) {}
    renderAll();
  });

  var savedTheme = null;
  try { savedTheme = localStorage.getItem("tv-demo-theme"); } catch (err) {}
  applyTheme(savedTheme === "dark" ? "dark" : "light");

  renderAll();
</script>
</body>
</html>
